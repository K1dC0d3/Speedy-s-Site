<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books</title>
  <link rel="stylesheet" href="../css/books.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <header>
    <nav></nav>
  </header>
  <canvas id="particles"></canvas>
  <main>
    <h1 class="text-white">The Imagination Series</h1>
    <section class="the-imagination">
      <a href="./books/the-imagination" class="text-decoration-none">
        <div class="book">
          <img src="../assets/IMG-20260710-WA0044.jpg" alt="">
          <h2>The Imagination</h2>
          <p>Lorem ip</p>
        </div>
      </a>
      <a href="./books/the-imagination-the-reality-seed" class="text-decoration-none">
        <div class="book">
          <img src="../assets/IMG-20260729-WA0010.jpg" alt="">
          <h2>The Imagination:<br>The Reality Seed</h2>
          <p>In the works</p>
        </div>
      </a>
    </section>
    <div class="divider">
      <span></span>
      <div class="star">✦</div>
      <span></span>
    </div>
    <h1 class="text-white">Hero Force Series</h1>
    <section class="hero-force">
      <a href="./books/hero-force" class="text-decoration-none">
        <div class="book">
          <img src="../assets/IMG-20260728-WA0002.jpg" alt="">
          <h2>Hero Force:<br>The Origin</h2>
          <p>Sep 30, 2025 | 3h 16m</p>
        </div>
      </a>

      <a href="./books/hero-force-shadows-of-lyricus" class="text-decoration-none">
        <div class="book">
          <img src="../assets/IMG-20260728-WA0004.jpg" alt="">
          <h2>Hero Force:<br>Shadows Of Lyricus</h2>
          <p>Dec 11, 2025 | 1h 5m</p>
        </div>
      </a>
      </div>
      <a href="./books/hero-force-frost-born-legacy" class="text-decoration-none">
        <div class="book">
          <img src="../assets/IMG-20260728-WA0008.jpg" alt="">
          <h2>Hero Force:<br>Frost Born Legacy</h2>
          <p>July 10, 2025 | </p>
        </div>
      </a>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resize();
    window.addEventListener("resize", resize);

    const particles = [];

    class Particle {

      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;

        this.radius = Math.random() * 2 + 1;

        this.speedX = (Math.random() - 0.5) * 0.2;
        this.speedY = -Math.random() * 0.3 - 0.05;

        this.alpha = Math.random() * 0.4 + 0.1;

        this.color = [
          "#d8b4fe",
          "#c084fc",
          "#a78bfa",
          "#ffffff"
        ][Math.floor(Math.random() * 4)];

        this.offset = Math.random() * Math.PI * 2;
      }

      update(time) {

        this.x += this.speedX;
        this.y += this.speedY;

        if (this.y < -10)
          this.y = canvas.height + 10;

        if (this.x < -10)
          this.x = canvas.width + 10;

        if (this.x > canvas.width + 10)
          this.x = -10;

        this.alpha += Math.sin(time * 0.001 + this.offset) * 0.002;
      }

      draw() {

        ctx.save();

        ctx.globalAlpha = this.alpha;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

        ctx.fillStyle = this.color;

        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;

        ctx.fill();

        ctx.restore();
      }

    }

    for (let i = 0; i < 120; i++)
      particles.push(new Particle());

    function animate(time) {

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(particle => {
        particle.update(time);
        particle.draw();
      });

      requestAnimationFrame(animate);

    }

    animate();
  </script>
</body>

</html>
