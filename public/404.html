<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | The SpeedVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Roboto:wght@400;500;700;900&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%,
          #24163d 0%,
          #100b1c 45%,
          #05030a 100%);
      color: white;
      font-family: "Roboto", sans-serif;
    }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .error-card {
      width: min(700px, 100%);
      max-height: 90vh;
      text-align: center;
      padding: 30px 40px;
      border-radius: 24px;
      background: rgba(17, 11, 30, 0.72);
      border: 1px solid rgba(192, 132, 252, 0.25);
      box-shadow:
        0 0 40px rgba(168, 85, 247, 0.08),
        0 30px 100px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      animation: appear 0.7s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    .error-code {
      font-family: "Nunito", sans-serif;
      font-size: clamp(6rem, 18vw, 11rem);
      font-weight: 800;
      line-height: 0.85;
      margin-bottom: 25px;
      background:
        linear-gradient(135deg,
          #ffffff,
          #d8b4fe,
          #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 0 40px rgba(168, 85, 247, 0.2);
    }

    h1 {
      font-family: "Nunito", sans-serif;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 800;
      margin-bottom: 15px;
    }

    .description {
      max-width: 500px;
      margin: 0 auto 30px;
      color: rgba(255, 255, 255, 0.72);
      font-family: "Nunito", sans-serif;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      width: min(400px, 80%);
      margin: 30px auto;
    }

    .divider span {
      height: 1px;
      flex: 1;
      background:
        linear-gradient(90deg,
          transparent,
          rgba(192, 132, 252, 0.7));
    }

    .divider span:last-child {
      background:
        linear-gradient(90deg,
          rgba(192, 132, 252, 0.7),
          transparent);
    }

    .star {
      color: #d8b4fe;
      font-size: 1.3rem;
      text-shadow:
        0 0 15px rgba(192, 132, 252, 0.8);
    }

    .home-button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-family: "Nunito", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      background:
        linear-gradient(135deg,
          #7c3aed,
          #a855f7);
      box-shadow:
        0 8px 25px rgba(124, 58, 237, 0.25);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .home-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 12px 35px rgba(168, 85, 247, 0.4);
    }

    .home-button:active {
      transform: translateY(-1px);
    }

    .credit {
      margin-top: 30px;
      font-family: "Nunito", sans-serif;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .credit span {
      color: rgba(216, 180, 254, 0.7);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform:
          translateY(20px) scale(0.96);
      }

      to {
        opacity: 1;
        transform:
          translateY(0) scale(1);
      }
    }

    @media (max-width: 600px) {
      main {
        padding: 20px;
      }

      .error-card {
        padding:
          50px 25px;
        border-radius: 20px;
      }

      .description {
        font-size: 0.95rem;
      }
    }
  </style>
</head>


<body>
  <canvas id="particles"></canvas>
  <main>
    <div class="error-card">
      <div class="error-code">
        404
      </div>
      <h1>
        This page has vanished into the Imaginarium.
      </h1>

      <p class="description">
        The path you followed doesn't appear to exist
        somewhere in the SpeedVerse.
      </p>

      <div class="divider">
        <span></span>
        <div class="star">✦</div>
        <span></span>
      </div>

      <a href="/" class="home-button"> Return Home →</a>


      <div class="credit">
        Website designed & developed by
        <span>Zion</span>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    const particleCount = window.innerWidth > 1200 ? 120 :
      window.innerWidth > 768 ? 70 :
        35;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resize();

    window.addEventListener("resize", resize);

    // Particle array
    const particles = [];

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;

        this.radius = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.speedY = -Math.random() * 0.3 - 0.05;

        this.alpha = Math.random() * 0.4 + 0.1;

        this.color = ["#d8b4fe", "#c084fc", "#a78bfa", "#ffffff"][Math.floor(Math.random() * 4)];

        this.offset =
          Math.random() *
          Math.PI *
          2;
      }


      update(time) {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.y < -10) {
          this.y = canvas.height + 10;
        }

        if (this.x < -10) {
          this.x = canvas.width + 10;
        }

        if (this.x > canvas.width + 10) {
          this.x = -10;
        }


        this.alpha +=
          Math.sin(
            time * 0.001 +
            this.offset
          ) * 0.002;
      }


      draw() {
        ctx.save();


        ctx.globalAlpha = this.alpha;

        ctx.beginPath();
        ctx.arc(
          this.x,
          this.y,
          this.radius,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          this.color;


        ctx.shadowBlur = 15;

        ctx.shadowColor = this.color;

        ctx.fill();


        ctx.restore();
      }

    }


    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }


    function animate(time) {
      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      particles.forEach(
        particle => {

          particle.update(time);

          particle.draw();

        }
      );

      requestAnimationFrame(
        animate
      );
    }


    animate();
  </script>

</body>

</html>
